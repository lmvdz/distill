[project]
name = "distill"
version = "0.1.0"
description = "Turns sources into evidence-backed, versioned knowledge catalogs."
requires-python = ">=3.13"
dependencies = [
  "gallery-dl>=1.30",
  "httpx>=0.28",
  "markdown>=3.7",
  "pydantic>=2.9",
  "yt-dlp[default]>=2026.1.1",
]

[project.optional-dependencies]
papers = ["pypdf>=6,<7"]
search = ["sentence-transformers[image]>=6.1,<7", "transformers>=5.19,<6"]
research = ["jev-ultrafast @ git+https://github.com/browser-use/jev-ultrafast@1231850a0bf1a0c0341fe408ef1668dbbfdfac46"]

[project.scripts]
distill = "distiller.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/distiller"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/distiller/*.py",
  "/src/distiller/catalog.html",
  "/pyproject.toml",
  "/README.md",
  "/SECURITY.md",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
