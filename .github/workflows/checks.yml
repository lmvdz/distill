name: Code and publication checks
on: [push, pull_request]
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync pytest
      - name: Audit runtime dependencies, including optional extras
        run: |
          uv export --all-extras --no-dev --no-emit-project --no-hashes --format requirements-txt --output-file "$RUNNER_TEMP/runtime-requirements.txt"
          uvx pip-audit==2.10.1 --disable-pip --no-deps --requirement "$RUNNER_TEMP/runtime-requirements.txt"
      - name: Install checksum-verified Gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          audit_dir="$RUNNER_TEMP/distill-security"
          mkdir -p "$audit_dir"
          gh release download v8.30.1 --repo gitleaks/gitleaks \
            --pattern gitleaks_8.30.1_linux_x64.tar.gz \
            --pattern gitleaks_8.30.1_checksums.txt --dir "$audit_dir"
          cd "$audit_dir"
          grep 'gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz
          echo "GITLEAKS_BIN=$audit_dir/gitleaks" >> "$GITHUB_ENV"
      - name: Check complete publication history and secrets
        run: python scripts/check_publish.py --ref HEAD --require-gitleaks
